<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>春天来了 · 专题导航</title>
  <meta name="description" content="春天来了相关1个专题评测页导航" />
  <style>
    :root{--bg:#0b1220;--card:#121a2b;--line:#24324d;--text:#e8eefc;--muted:#93a0b8}
    *{box-sizing:border-box} body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(900px 500px at 10% -10%,rgba(56,189,248,.15),transparent 55%),var(--bg);color:var(--text);min-height:100vh;padding:28px 16px 48px}
    .wrap{width:min(1100px,100%);margin:0 auto} h1{margin:0 0 8px;font-size:28px} .sub{color:var(--muted);margin-bottom:22px;line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .card{display:block;text-decoration:none;color:inherit;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;transition:.15s ease}
    .card:hover{transform:translateY(-2px);border-color:#38bdf8}
    .tag{display:inline-block;font-size:11px;color:#7dd3fc;background:rgba(56,189,248,.12);border-radius:999px;padding:2px 8px;margin-bottom:10px;text-transform:uppercase}
    .card h2{margin:0 0 8px;font-size:16px;line-height:1.45} .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
    .foot{margin-top:24px;color:#64748b;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>春天来了 · 专题导航</h1>
    <div class="sub">共 1 个页面 · 每页独立主题色与文案 · rosaleskayla3.github.io</div>
    <div class="grid">      <a class="card theme-" href="/p01/">
        <div class="tag">p01</div>
        <h2>春天来了</h2>
        <p>…</p>
      </a></div>
    <div class="foot">GitHub Pages 批量发布 · 模板逐页改动</div>
  </div>
</body>
</html>
